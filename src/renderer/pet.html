<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="pet.css" />
    <title>Curie pet</title>
  </head>
  <body>
    <canvas id="pet" aria-label="Curie study companion" role="button" tabindex="0"></canvas>
    <aside id="debug" hidden></aside>
    <menu id="scale-menu" hidden>
      <li><button type="button" data-action="open-panel">Open panel</button></li>
      <li><button type="button" data-scale="6">Small · 6×</button></li>
      <li><button type="button" data-scale="10">Medium · 10×</button></li>
      <li><button type="button" data-scale="14">Large · 14×</button></li>
    </menu>
    <aside id="browser-panel" hidden>Preview control panel</aside>
    <script type="module" src="pet.js"></script>
  </body>
</html>
