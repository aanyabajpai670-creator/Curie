<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="panel.css" />
    <title>Curie</title>
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">✦</div>
        <div>
          <h1>Curie</h1>
          <p>Your study companion</p>
        </div>
      </header>
      <section class="timer-card">
        <p id="phase" class="eyebrow">FOCUS SESSION</p>
        <div id="timer" class="timer">25:00</div>
        <p id="session-count" class="session-count">0 sessions complete</p>
        <button id="primary" type="button">Start studying</button>
        <div class="controls">
          <button id="pause" type="button" class="secondary">Pause</button>
          <button id="skip" type="button" class="secondary">Skip</button>
          <button id="reset" type="button" class="secondary">Reset</button>
        </div>
      </section>
      <section id="reminder" class="reminder" hidden></section>
      <details class="settings">
        <summary>Settings</summary>
        <form id="settings-form">
          <label>Focus minutes <input name="workMinutes" type="number" min="1" max="180" required /></label>
          <label>Break minutes <input name="breakMinutes" type="number" min="1" max="60" required /></label>
          <label>Time zone <input name="timeZone" maxlength="120" placeholder="Asia/Kolkata" required /></label>
          <label>Quiet hours start <input name="quietStart" type="time" required /></label>
          <label>Quiet hours end <input name="quietEnd" type="time" required /></label>
          <label>Nudge interval (minutes) <input name="nudgeFrequency" type="number" min="1" max="1440" required /></label>
          <label>Maximum nudges each day <input name="maxNudgesPerDay" type="number" min="0" max="20" required /></label>
          <label>Maximum provider calls per day <input name="maxLlmCallsPerDay" type="number" min="50" max="1500" required /></label>
          <label><input name="verboseAgentLog" type="checkbox" /> Verbose agent log (still excludes message text and API keys)</label>
          <label>Gemini model <input name="geminiModel" maxlength="120" required /></label>
          <label>Groq model <input name="groqModel" maxlength="120" required /></label>
          <label>Gemini API key <input name="geminiApiKey" type="password" autocomplete="new-password" placeholder="Stored encrypted on this computer" /></label>
          <label><input name="clearGeminiKey" type="checkbox" /> Remove saved Gemini key</label>
          <label>Groq API key <input name="groqApiKey" type="password" autocomplete="new-password" placeholder="Stored encrypted on this computer" /></label>
          <label><input name="clearGroqKey" type="checkbox" /> Remove saved Groq key</label>
          <label class="check"><input name="shortcutEnabled" type="checkbox" /> Enable macOS Shortcuts</label>
          <label>Start shortcut name <input name="startShortcut" maxlength="120" /></label>
          <label>End shortcut name <input name="endShortcut" maxlength="120" /></label>
          <label>Pet size
            <select name="petScale" required>
              <option value="6">Small · 6×</option>
              <option value="10">Medium · 10×</option>
              <option value="14">Large · 14×</option>
            </select>
          </label>
          <label class="check"><input name="launchAtLogin" type="checkbox" /> Launch Curie at login</label>
          <button type="submit">Save settings</button>
          <p id="settings-status" role="status" aria-live="polite"></p>
        </form>
      </details>
      <section class="tasks">
        <div class="section-heading">
          <h2>Tasks</h2>
          <span id="task-count">0</span>
        </div>
        <form id="task-form">
          <input
            id="task-title"
            maxlength="200"
            placeholder="Add a task"
            aria-label="Task title"
            required
          />
          <details>
            <summary>Details and reminder</summary>
            <input
              id="task-subject"
              maxlength="120"
              placeholder="Subject"
              aria-label="Subject"
            />
            <input
              id="task-due"
              type="datetime-local"
              aria-label="Due date and time"
            />
            <input
              id="task-estimate"
              type="number"
              min="1"
              placeholder="Estimated minutes"
              aria-label="Estimated minutes"
            />
            <input
              id="task-reminder"
              type="number"
              min="1"
              placeholder="Remind minutes before due"
              aria-label="Remind minutes before due"
            />
            <input
              id="task-reminder-at"
              type="datetime-local"
              aria-label="Remind at date and time"
            />
          </details>
          <button type="submit">Add task</button>
          <p id="task-error" role="alert"></p>
        </form>
        <ul id="task-list"></ul>
      </section>
      <section class="chat">
        <div class="section-heading"><h2>Chat with Curie</h2></div>
        <ul id="chat-messages" aria-live="polite"></ul>
        <form id="chat-form">
          <textarea
            id="chat-input"
            maxlength="2000"
            rows="2"
            placeholder="What do you need to study?"
            aria-label="Message Curie"
          ></textarea>
          <button id="chat-send" type="submit">Send</button>
        </form>
      </section>
    </main>
    <script type="module" src="panel.js"></script>
  </body>
</html>
